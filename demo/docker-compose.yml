# A second, throwaway Jarvis on the same checkout — for screenshots and demos.
#
#   bash demo/demo.sh seed     # once — build a clean agent dir + demo/.env
#   bash demo/demo.sh up       # http://localhost:5273
#
# NB: paths below are relative to the REPO ROOT, not to this file. Compose
# resolves them against the project directory, which is the directory of the
# first -f (docker-compose.yml at the root). demo.sh always invokes it that way.
#
# The source tree is shared — same code, no second clone, no drift between what
# you screenshot and what you ship — but mounted READ-ONLY. Everything that
# could carry your data, or let a demo conversation touch your repo, is not:
#
#   • source     → read-only; the demo can browse and diff it, never write it
#   • agent dir  → demo/instance/agent (DB, conversations, connectors, memory,
#                  uploads — all fresh, all writable)
#   • env        → demo/.env, with its own JWT and internal secrets
#   • ports      → 5273 / 3105
#   • network    → its own; no DNS collision with the instance you're using
#   • whisper    → off; a second ASR model in RAM buys nothing for screenshots
#
# What read-only costs: the demo cannot commit, and cannot demo self-editing.
# Screenshot that flow on your own instance, where you'd review the diff anyway.
# Each service overrides its command to `npm ci` (see below) so the install
# itself doesn't need to write. If something else ever refuses to run against
# the mount, DEMO_SOURCE_MODE=rw is the escape hatch — and then the caveat
# above becomes real again.

services:
  setup:
    volumes:
      - ./demo/instance/agent:/agent

  backend:
    # `npm ci`, not the base `npm install`: install wants to rewrite
    # package-lock.json and dies with EROFS on the read-only source mount.
    # ci installs the locked versions and never writes the lockfile — which
    # also pins the demo to exactly the dependencies that ship.
    command: sh -c "npm ci && npx tsx watch src/index.ts"
    volumes:
      - ./:/jarvis:${DEMO_SOURCE_MODE:-ro}
      - ./demo/instance/agent:/jarvis/agent
      - /jarvis/backend/node_modules
    # !override, not a plain list: Compose APPENDS env_file across files, so
    # without it the demo loads the root .env too and comes up holding whatever
    # real connector credentials live there. Overriding means the demo reads
    # only its own env — which stays true for credentials added later, where a
    # hardcoded list of names to blank would silently fall behind.
    env_file: !override
      - path: demo/.env
        required: false
    environment:
      # Empty unless the demo's own browser is up (DEMO_BROWSER=1) — never the
      # host instance's, which is a different container on a different network.
      BROWSER_URL: ${DEMO_BROWSER_URL:-}
      BROWSER_USER: jarvis
      BROWSER_PASSWORD: jarvis
    # !override, not a plain list: Compose APPENDS port lists across files, so
    # without it the demo inherits the base 3005/5173 bindings too and fails to
    # start against the instance already holding them.
    ports: !override
      # Set DEMO_BIND_ADDR=0.0.0.0 if you want Jarvis (running in a container)
      # to reach this instance to drive it and take the screenshots itself.
      - '${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_BACKEND_PORT:-3105}:3005'

  engine:
    # See backend — `npm ci` so the read-only source mount stays read-only.
    command: sh -c "npm ci && npx tsx src/index.ts"
    volumes:
      - ./:/jarvis:${DEMO_SOURCE_MODE:-ro}
      - ./demo/instance/agent:/jarvis/agent
      - /jarvis/engine/node_modules
    # See backend — the demo reads only its own env file.
    env_file: !override
      - path: demo/.env
        required: false
    environment:
      # Empty unless the demo's own browser is up (DEMO_BROWSER=1) — never the
      # host instance's, which is a different container on a different network.
      BROWSER_URL: ${DEMO_BROWSER_URL:-}
      BROWSER_USER: jarvis
      BROWSER_PASSWORD: jarvis

  # ── Optional headful browser ────────────────────────────────────────────────
  # Off unless DEMO_BROWSER=1, which makes demo.sh ask for the `browser`
  # profile. Without it the Browser page in a shot is only its empty state,
  # which sells the feature short; with it, a real Chromium is on screen.
  # Its own profile directory and uploads, like everything else the demo owns.
  chromium:
    environment:
      # Pinned, not inherited: the base compose reads PASSWORD from the root
      # .env, while the demo backend proxies with jarvis/jarvis (its own env
      # above). Left to drift apart the proxy gets a 401 from the browser's
      # nginx and the page renders an error instead of a browser.
      CUSTOM_USER: jarvis
      PASSWORD: jarvis
    volumes:
      - ./demo/instance/agent/data/browser-profile:/config

  browser-mcp:
    volumes:
      - ./demo/instance/agent/workspace/uploads:/uploads

  frontend:
    # See backend — `npm ci` so the read-only source mount stays read-only.
    command: sh -c "npm ci && npx vite build && { npx vite build --watch & exec npm run preview -- --host; }"
    volumes:
      - ./frontend:/app:${DEMO_SOURCE_MODE:-ro}
      - /app/node_modules
      # Container-local build output — writable even when the source isn't, and
      # separate from the other stack's. Without it both `vite build --watch`
      # processes write the same host ./frontend/dist and can serve each other
      # a torn build.
      - /app/dist
    ports: !override
      - '${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_FRONTEND_PORT:-5273}:5173'

  playwright:
    volumes:
      - ./demo/instance/agent/workspace/uploads:/uploads

  # Not started: `profiles` keeps a service out of `up` unless the profile is
  # asked for, and nothing depends_on whisper. Voice input is a button in the
  # UI — screenshotting it doesn't need the model loaded a second time.
  whisper:
    profiles: [ voice ]
