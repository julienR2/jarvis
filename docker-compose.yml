# Cap per-container log growth. Without this the default json-file driver never
# rotates, and the engine (which logs every Claude stream event, including file
# contents from tool results) grows /var/lib/docker without bound.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Pre-creates agent/{data,workspace} with uid 1000 ownership so playwright
  # (which runs as root and would otherwise win the race) doesn't materialize
  # them as root-owned dirs the backend can't write to. Runs once and exits.
  setup:
    image: alpine:3
    command: sh -c "mkdir -p /agent/data /agent/workspace/apps /agent/workspace/uploads && chown -R 1000:1000 /agent"
    volumes:
      - ./agent:/agent
    restart: 'no'

  backend:
    build: ./backend
    container_name: jarvis-backend
    working_dir: /jarvis/backend
    command: sh -c "npm install && npx tsx watch src/index.ts"
    volumes:
      - ./:/jarvis
      - /jarvis/backend/node_modules
    # Optional — secrets are auto-generated on first boot and the Claude OAuth
    # token is entered through the setup wizard, so a fresh clone runs with no
    # .env at all. (`required: false` needs Compose v2.24+.)
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3005
      DB_PATH: /jarvis/agent/data/jarvis.db
      WORKSPACE_DIR: /jarvis/agent/workspace
      SECRETS_PATH: /jarvis/agent/data/secrets.json
      JARVIS_REPO_DIR: /jarvis
      WHISPER_URL: http://whisper:9000
      ENGINE_URL: http://engine:3010
      TZ: ${TZ:-UTC}
    ports:
      # Bind to loopback only — external traffic reaches the backend through nginx
      # over the `homelab` network (by container name), not this published port.
      # This keeps the plain-HTTP API (JWT login, /internal) off the LAN.
      - '127.0.0.1:3005:3005'
    depends_on:
      setup:
        condition: service_completed_successfully
      engine:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  engine:
    build: ./engine
    container_name: jarvis-engine
    working_dir: /jarvis/engine
    command: sh -c "npm install && npx tsx src/index.ts"
    volumes:
      - ./:/jarvis
      - /jarvis/engine/node_modules
    env_file:
      - path: .env
        required: false
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      CLAUDE_CONFIG_DIR: /jarvis/agent
      WORKSPACE_DIR: /jarvis/agent/workspace
      SECRETS_PATH: /jarvis/agent/data/secrets.json
      BACKEND_URL: http://backend:3005
      PORT: 3010
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: node:25
    container_name: jarvis-frontend
    working_dir: /app
    command: sh -c "npm install && npx vite build --watch & sleep 5 && npm run preview -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # Loopback only — served to the LAN through nginx, not this port. See backend.
      - '127.0.0.1:5173:5173'
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: jarvis-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper-cache:/root/.cache
    logging: *default-logging

  playwright:
    image: mcr.microsoft.com/playwright/mcp
    container_name: jarvis-playwright
    command: [ "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--headless", "--isolated", "--output-dir", "/uploads" ]
    volumes:
      - ./agent/workspace/uploads:/uploads
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

volumes:
  whisper-cache:
