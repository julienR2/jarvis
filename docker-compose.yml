# Cap per-container log growth. Without this the default json-file driver never
# rotates, and the engine (which logs every Claude stream event, including file
# contents from tool results) grows /var/lib/docker without bound.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Pre-creates agent/{data,workspace} with uid 1000 ownership so playwright
  # (which runs as root and would otherwise win the race) doesn't materialize
  # them as root-owned dirs the backend can't write to. Also prepares what the
  # engine mounts from in there (agent/data/engine) and the e2e runners'
  # node_modules volumes, which Docker would otherwise create root-owned.
  # And the mount points the engine nests inside its read-only mounts: Docker
  # cannot create a directory inside a read-only bind, so a fresh clone without
  # them would leave the engine unable to start. Runs once and exits.
  setup:
    image: alpine:3
    command: >
      sh -c "mkdir -p /agent/data/engine /agent/workspace/apps /agent/workspace/uploads
      /repo/engine/node_modules /repo/backend/node_modules /repo/frontend/node_modules
      /repo/e2e/node_modules &&
      chown -R 1000:1000 /agent/data /agent/workspace /e2e-engine /e2e-deploy /engine-deploy &&
      chown 1000:1000 /repo/engine/node_modules /repo/backend/node_modules
      /repo/frontend/node_modules /repo/e2e/node_modules"
    volumes:
      - ./agent:/agent
      - ./:/repo
      - engine-e2e-node-modules:/e2e-engine
      - deploy-e2e-node-modules:/e2e-deploy
      - deploy-engine-node-modules:/engine-deploy
    restart: 'no'

  # No container_name anywhere: Compose prefixes containers with the project
  # (directory) name, so several clones can run side by side on one host.
  # Services reach each other by service name (backend, engine, whisper, ...).
  # Pin names in docker-compose.override.yml if something external (e.g. a
  # reverse proxy) routes by container name.
  backend:
    build: ./backend
    working_dir: /jarvis/backend
    # No file watcher: this is the instance you talk to, and a half-saved edit
    # used to take it down mid-conversation. Source on disk is inert until the
    # `deploy` skill asks for a restart (POST /internal/restart), or the
    # container is recreated.
    command: sh -c "npm install && npx tsx src/index.ts"
    volumes:
      - ./:/jarvis
      # Named, not anonymous, so the engine can mount the same tree read-only
      # and typecheck backend code the agent edits. Still a volume rather than
      # the host's ./backend/node_modules: better-sqlite3 and bcrypt are native
      # modules compiled for this container's OS and arch, and a host-built
      # binary bind-mounted in here crashes on load.
      - backend-node-modules:/jarvis/backend/node_modules
    # Optional — secrets are auto-generated on first boot and the Claude OAuth
    # token is entered through the setup wizard, so a fresh clone runs with no
    # .env at all. (`required: false` needs Compose v2.24+.)
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3005
      DB_PATH: /jarvis/agent/data/jarvis.db
      WORKSPACE_DIR: /jarvis/agent/workspace
      SECRETS_PATH: /jarvis/agent/data/secrets.json
      JARVIS_REPO_DIR: /jarvis
      WHISPER_URL: http://whisper:9000
      ENGINE_URL: http://engine:3010
      TZ: ${TZ:-UTC}
    ports:
      # Bind to loopback only — external traffic reaches the backend through a
      # reverse proxy on the Docker network, not this published port. This keeps
      # the plain-HTTP API (JWT login, /internal) off the LAN. Override the host
      # port (e.g. for a second instance) with BACKEND_PORT.
      - '${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-3005}:3005'
    depends_on:
      setup:
        condition: service_completed_successfully
      engine:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  # Where the agent runs — and so what a prompt-injected page, email or webhook
  # could reach. It mounts only what the agent needs, and none of what would
  # let it read secrets, rewrite its own logic, or put code live:
  #
  #   agent/           read-write: its workspace, memory, sessions, CLI state —
  #     data/          …except this, hidden behind an empty tmpfs: the database,
  #                    secrets.json, VAPID keys. The agent reaches data through
  #                    the backend's /internal API, which decides what it sees.
  #     skills/ rules/ CLAUDE.md settings.json mcp.json
  #                    read-only. Skills change through the backend
  #                    (POST /internal/skills, see the `skills` skill), which
  #                    refuses to touch the ones the repo ships.
  #   engine/          read-only: the code running the agent.
  #   frontend/src/    read-write, so it can still propose interface changes —
  #                    inert until a person commits and deploys them from the
  #                    host (docker compose run --rm deploy). The rest of
  #                    frontend/, dist included, is read-only.
  #   backend/ e2e/    read-only, for the throwaway stack e2e/shot.sh starts.
  #
  # No .env either: it carries the JWT secret and the admin password, and any
  # process here can read the engine's environment. The engine's own
  # credentials come from agent/data/engine/, a mirror the backend writes with
  # only the values the agent's environment carries anyway (backend/src/secrets.ts).
  engine:
    build: ./engine
    working_dir: /jarvis/engine
    # `npm ci`, not install: the package directory is read-only here, and only
    # ci leaves the lockfile alone. It reinstalls into the volume each start.
    command: sh -c "npm ci --no-audit --no-fund && npx tsx src/index.ts"
    volumes:
      - ./engine:/jarvis/engine:ro
      - engine-node-modules:/jarvis/engine/node_modules
      - ./agent:/jarvis/agent
      - ./agent/CLAUDE.md:/jarvis/agent/CLAUDE.md:ro
      - ./agent/settings.json:/jarvis/agent/settings.json:ro
      - ./agent/mcp.json:/jarvis/agent/mcp.json:ro
      - ./agent/rules:/jarvis/agent/rules:ro
      - ./agent/skills:/jarvis/agent/skills:ro
      - ./agent/data/engine:/run/jarvis:ro
      - ./frontend:/jarvis/frontend:ro
      - ./frontend/src:/jarvis/frontend/src
      # Each tree belongs to the service that installs it; read-only here, for
      # typechecking and the throwaway stack.
      - frontend-node-modules:/jarvis/frontend/node_modules:ro
      - ./backend:/jarvis/backend:ro
      - backend-node-modules:/jarvis/backend/node_modules:ro
      - ./e2e:/jarvis/e2e:ro
      - engine-e2e-node-modules:/jarvis/e2e/node_modules
    tmpfs:
      - /jarvis/agent/data
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      CLAUDE_CONFIG_DIR: /jarvis/agent
      WORKSPACE_DIR: /jarvis/agent/workspace
      BACKEND_URL: http://backend:3005
      PORT: 3010
      TZ: ${TZ:-UTC}
      CLAUDE_TELEMETRY: ${CLAUDE_TELEMETRY:-false}
      # e2e/ is read-only here; the suite writes its artefacts there instead.
      E2E_RESULTS_DIR: /tmp/e2e-results
    restart: unless-stopped
    logging: *default-logging

  # Puts the code on disk into the running instance. Not a running service: a
  # tool, started from the host only, after a person has reviewed and committed
  # the change. It mounts everything (it has to write frontend/dist and read the
  # secret that restarts the backend), which is exactly why nothing in it may
  # come from a place the agent can write:
  #   - its own engine and e2e node_modules, installed here — never the
  #     engine's, which the agent's user owns;
  #   - a PATH without any node_modules/.bin, and bash by absolute path;
  #   - no .env: deploy.sh reads the one secret it needs from secrets.json.
  # The backend's and frontend's node_modules are shared read-only: the agent
  # has them read-only too, and only their own services write them.
  #
  #   docker compose run --rm deploy [--dry-run] [--fast] [--engine] [--all]
  deploy:
    profiles: [ tools ]
    build: ./engine
    working_dir: /jarvis
    entrypoint: [ "/bin/bash", "/jarvis/scripts/deploy.sh" ]
    volumes:
      - ./:/jarvis
      - backend-node-modules:/jarvis/backend/node_modules:ro
      - frontend-node-modules:/jarvis/frontend/node_modules:ro
      - deploy-engine-node-modules:/jarvis/engine/node_modules
      - deploy-e2e-node-modules:/jarvis/e2e/node_modules
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      BACKEND_URL: http://backend:3005
      ENGINE_URL: http://engine:3010
      TZ: ${TZ:-UTC}
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: 'no'

  frontend:
    image: node:25
    working_dir: /app
    # Install and first build run to completion in the FOREGROUND before
    # preview starts: a backgrounded install once left preview dying first
    # (`vite: not found`) and a truncated native binary crash-looping.
    # Serves the production build in dist/ and nothing else. The build itself
    # runs here only when dist/ is missing (a fresh clone); afterwards the
    # `deploy` skill builds from the engine and drops the result into dist/,
    # index.html last, so preview never serves a torn bundle. No `--watch`:
    # a source edit must not reach this instance until it is deployed.
    # This container is root; the engine (which deploys) is uid 1000 — hence
    # the chown, so what is built here can later be replaced from there.
    command: sh -c "npm install && { [ -f dist/index.html ] || npx vite build; } && chown -R 1000:1000 dist && exec npm run preview -- --host"
    volumes:
      - ./frontend:/app
      # Named so the engine can mount it read-only for typechecking; see backend.
      - frontend-node-modules:/app/node_modules
    ports:
      # Loopback only — served to the LAN through a reverse proxy, not this
      # port. See backend. Override the host port with FRONTEND_PORT.
      - '${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173'
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper-cache:/root/.cache
    logging: *default-logging

  playwright:
    image: mcr.microsoft.com/playwright/mcp
    command: [ "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--headless", "--isolated", "--output-dir", "/uploads" ]
    volumes:
      - ./agent/workspace/uploads:/uploads
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  # ── Optional headful browser ────────────────────────────────────────────────
  #
  # Off by default. Start it with:  docker compose --profile browser up -d
  #
  # The bundled `playwright` service above is headless and isolated, which is
  # right for most work but cannot take a login or a captcha for you. This one
  # is a real Chromium with a persistent profile that you can watch and click
  # through Settings → Browser — the agent and the human drive the same session.
  #
  # It publishes no port: the backend proxies it behind your Jarvis login, so
  # there is no second password and nothing extra exposed.
  chromium:
    profiles: [ browser ]
    image: lscr.io/linuxserver/chromium:latest
    security_opt:
      # Chromium's own sandbox needs syscalls the default seccomp profile blocks.
      - seccomp:unconfined
    environment:
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      TZ: ${TZ:-UTC}
      CUSTOM_USER: jarvis
      # Only reachable through the authenticated proxy, so this is a formality —
      # KasmVNC refuses to start without one.
      PASSWORD: ${BROWSER_PASSWORD:-jarvis}
      # DevTools stays on localhost inside this container; the MCP service below
      # shares the network namespace, and Chrome rejects DevTools requests whose
      # Host header is neither localhost nor a bare IP.
      CHROME_CLI: '--remote-debugging-port=9222'
    volumes:
      # Logins, cookies and solved challenges persist here — which is most of
      # the point, an aged profile is far less suspicious than a fresh one.
      - ./agent/data/browser-profile:/config
    shm_size: 1gb
    restart: unless-stopped
    logging: *default-logging

  # Playwright MCP attached to the Chromium above over CDP. It ATTACHES to a
  # running browser rather than launching one, so the session carries neither
  # --enable-automation nor navigator.webdriver.
  #
  # Shares chromium's network namespace, so it has no address of its own and is
  # reached as `chromium:8931`.
  browser-mcp:
    profiles: [ browser ]
    image: mcr.microsoft.com/playwright/mcp
    network_mode: 'service:chromium'
    # The image's default user doesn't own the uploads dir, so screenshots fail
    # with EACCES. HOME follows, since the image's home isn't writable for it.
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      HOME: /tmp
    # Sharing chromium's network namespace means joining the one it had when
    # this container started. When chromium restarts on its own (crash, a
    # `docker restart`, a host reboot in the wrong order) it gets a fresh
    # namespace and this server is left in the dead one: still running, but
    # unreachable from the engine and unable to reach DevTools — the agent
    # reports the browser down while Settings → Browser works fine.
    #
    # Hence the watchdog: if DevTools stays unreachable for a minute, exit, and
    # the restart policy starts this container again inside chromium's current
    # namespace. The server arguments are the image's own entrypoint's plus ours.
    entrypoint: [ "/usr/bin/tini", "-s", "--", "sh", "-c" ]
    command:
      - |
        node /app/cli.js --headless --browser chromium --no-sandbox \
          --port 8931 --host 0.0.0.0 --allowed-hosts '*' \
          --cdp-endpoint http://localhost:9222 --output-dir /uploads &
        server=$$!
        misses=0
        while sleep 10; do
          kill -0 $$server 2>/dev/null || exit 1
          if node -e 'fetch("http://localhost:9222/json/version").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'; then
            misses=0
          else
            misses=$$((misses + 1))
          fi
          if [ $$misses -ge 6 ]; then
            echo "[watchdog] Chromium DevTools unreachable for 60s, restarting to rejoin its network"
            kill $$server
            exit 1
          fi
        done
    volumes:
      - ./agent/workspace/uploads:/uploads
    depends_on:
      - chromium
    restart: unless-stopped
    logging: *default-logging

volumes:
  whisper-cache:
  # One per service, each populated by that service's own `npm install` on boot.
  # Named rather than anonymous so the engine can mount the backend's and the
  # frontend's read-only — that is what lets the agent typecheck its own edits.
  backend-node-modules:
  frontend-node-modules:
  engine-node-modules:
  # The e2e runner's and the engine's again, for the deploy tool: the engine's
  # own are writable by the agent, so deploy never loads them.
  engine-e2e-node-modules:
  deploy-e2e-node-modules:
  deploy-engine-node-modules:
