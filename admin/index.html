<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Admin — Recovery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a; color: #e5e5e5;
      padding: 1.5rem; max-width: 800px; margin: 0 auto;
      line-height: 1.5;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem; }
    .subtitle { color: #737373; font-size: 0.85rem; margin-bottom: 1.5rem; }

    /* Status badge */
    .status-bar {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem; border-radius: 0.5rem;
      margin-bottom: 1.5rem; font-size: 0.9rem;
    }
    .status-bar.clean { background: #052e16; border: 1px solid #166534; }
    .status-bar.dirty { background: #451a03; border: 1px solid #92400e; }
    .status-bar .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .status-bar.clean .dot { background: #4ade80; }
    .status-bar.dirty .dot { background: #fb923c; }
    .branch { color: #a3a3a3; font-size: 0.8rem; margin-left: auto; font-family: monospace; }

    /* Changed files */
    .files { margin-bottom: 1.5rem; }
    .files summary {
      cursor: pointer; font-size: 0.85rem; color: #a3a3a3;
      padding: 0.5rem 0;
    }
    .files ul {
      list-style: none; padding: 0.5rem 0; font-family: monospace; font-size: 0.8rem;
    }
    .files li { padding: 0.2rem 0; }
    .files .st { display: inline-block; width: 1.5rem; color: #facc15; }

    /* Actions */
    .actions {
      display: flex; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap;
    }
    button {
      padding: 0.6rem 1.25rem; border-radius: 0.5rem; border: 1px solid #333;
      background: #1a1a1a; color: #e5e5e5; font-size: 0.85rem;
      cursor: pointer; transition: all 0.15s;
    }
    button:hover { background: #262626; border-color: #555; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { border-color: #7f1d1d; color: #fca5a5; }
    button.danger:hover { background: #2a0a0a; border-color: #991b1b; }
    button.warn { border-color: #78350f; color: #fde68a; }
    button.warn:hover { background: #1c1408; border-color: #92400e; }

    /* Commit log */
    .log-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; }
    .commits { list-style: none; }
    .commits li {
      padding: 0.5rem 0.75rem; border-radius: 0.375rem;
      display: flex; align-items: baseline; gap: 0.75rem;
      font-size: 0.85rem;
    }
    .commits li:hover { background: #141414; }
    .commits .hash {
      font-family: monospace; font-size: 0.75rem; color: #737373;
      flex-shrink: 0;
    }
    .commits .msg { flex: 1; }
    .commits .date { color: #525252; font-size: 0.75rem; flex-shrink: 0; }

    /* Diff viewer */
    .diff-section { margin-bottom: 1.5rem; }
    .diff-section summary {
      cursor: pointer; font-size: 0.85rem; color: #a3a3a3; padding: 0.5rem 0;
    }
    pre.diff {
      background: #111; padding: 0.75rem; border-radius: 0.5rem;
      font-size: 0.75rem; overflow-x: auto; max-height: 400px;
      overflow-y: auto; white-space: pre; tab-size: 4;
    }
    .diff .add { color: #4ade80; }
    .diff .del { color: #f87171; }
    .diff .hunk { color: #60a5fa; }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      padding: 0.6rem 1.25rem; border-radius: 0.5rem; font-size: 0.85rem;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.ok { background: #166534; color: #bbf7d0; }
    .toast.err { background: #7f1d1d; color: #fecaca; }
    .toast.show { opacity: 1; }

    /* Loading */
    .loading { color: #525252; font-size: 0.85rem; padding: 1rem 0; }
  </style>
</head>
<body>
  <h1>Jarvis Admin</h1>
  <p class="subtitle">Emergency recovery — discard changes, revert commits, restart services</p>

  <div id="status-bar" class="status-bar clean">
    <span class="dot"></span>
    <span id="status-text">Loading...</span>
    <span id="branch" class="branch"></span>
  </div>

  <div id="files-section" class="files" style="display:none">
    <details open>
      <summary id="files-summary">Changed files</summary>
      <ul id="files-list"></ul>
    </details>
  </div>

  <div id="diff-section" class="diff-section" style="display:none">
    <details>
      <summary>View uncommitted diff</summary>
      <pre class="diff" id="diff-content"></pre>
    </details>
  </div>

  <div class="actions">
    <button id="btn-discard" class="warn" onclick="discard()" disabled>
      Discard Uncommitted Changes
    </button>
    <button id="btn-revert" class="danger" onclick="revert()" disabled>
      Revert Last Commit
    </button>
    <button id="btn-restart" onclick="restart()">
      Restart Jarvis
    </button>
    <button onclick="refresh()" style="margin-left:auto">Refresh</button>
  </div>

  <div class="log-title">Recent commits</div>
  <ul id="commits" class="commits">
    <li class="loading">Loading...</li>
  </ul>

  <div id="toast" class="toast"></div>

  <script>
    let state = null

    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.className = `toast ${type} show`
      setTimeout(() => el.classList.remove('show'), 3000)
    }

    function colorDiff(text) {
      return text.split('\n').map(line => {
        if (line.startsWith('+') && !line.startsWith('+++'))
          return `<span class="add">${esc(line)}</span>`
        if (line.startsWith('-') && !line.startsWith('---'))
          return `<span class="del">${esc(line)}</span>`
        if (line.startsWith('@@'))
          return `<span class="hunk">${esc(line)}</span>`
        return esc(line)
      }).join('\n')
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    function relTime(dateStr) {
      const d = new Date(dateStr)
      const now = new Date()
      const diff = (now - d) / 1000
      if (diff < 60) return 'just now'
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`
      return `${Math.floor(diff / 86400)}d ago`
    }

    async function refresh() {
      try {
        const [statusRes, diffRes] = await Promise.all([
          fetch('/api/status'),
          fetch('/api/diff'),
        ])
        state = await statusRes.json()
        const diffData = await diffRes.json()

        // Status bar
        const bar = document.getElementById('status-bar')
        bar.className = `status-bar ${state.dirty ? 'dirty' : 'clean'}`
        document.getElementById('status-text').textContent =
          state.dirty ? `${state.files.length} uncommitted change(s)` : 'Working tree clean'
        document.getElementById('branch').textContent = state.branch

        // Changed files
        const filesSection = document.getElementById('files-section')
        if (state.dirty && state.files.length) {
          filesSection.style.display = ''
          document.getElementById('files-summary').textContent =
            `${state.files.length} changed file(s)`
          document.getElementById('files-list').innerHTML = state.files
            .map(f => `<li><span class="st">${esc(f.status)}</span>${esc(f.file)}</li>`)
            .join('')
        } else {
          filesSection.style.display = 'none'
        }

        // Diff
        const diffSection = document.getElementById('diff-section')
        const fullDiff = (diffData.diff || '') + (diffData.staged || '')
        if (fullDiff.trim()) {
          diffSection.style.display = ''
          document.getElementById('diff-content').innerHTML = colorDiff(fullDiff)
        } else {
          diffSection.style.display = 'none'
        }

        // Buttons
        document.getElementById('btn-discard').disabled = !state.dirty
        document.getElementById('btn-revert').disabled = false

        // Commits
        const list = document.getElementById('commits')
        if (state.commits.length) {
          list.innerHTML = state.commits.map(c => `
            <li>
              <span class="hash">${c.hash.slice(0, 7)}</span>
              <span class="msg">${esc(c.message)}</span>
              <span class="date">${relTime(c.date)}</span>
            </li>
          `).join('')
        } else {
          list.innerHTML = '<li class="loading">No commits</li>'
        }
      } catch (err) {
        toast('Failed to load status: ' + err.message, 'err')
      }
    }

    async function discard() {
      if (!state?.dirty) return
      if (!confirm('Discard ALL uncommitted changes? This cannot be undone.')) return

      try {
        document.getElementById('btn-discard').disabled = true
        const res = await fetch('/api/discard', { method: 'POST' })
        const data = await res.json()
        if (data.ok) {
          toast('Uncommitted changes discarded')
          refresh()
        } else {
          toast(data.error || 'Failed', 'err')
        }
      } catch (err) {
        toast(err.message, 'err')
      }
    }

    async function revert() {
      const msg = state?.commits?.[0]?.message || 'unknown'
      if (!confirm(`Reset last commit?\n\n"${msg}"\n\nThis will remove the commit entirely.`)) return

      try {
        document.getElementById('btn-revert').disabled = true
        const res = await fetch('/api/revert', { method: 'POST' })
        const data = await res.json()
        if (data.ok) {
          toast('Last commit reverted')
          refresh()
        } else {
          toast(data.error || 'Failed', 'err')
        }
      } catch (err) {
        toast(err.message, 'err')
      }
    }

    async function restart() {
      if (!confirm('Restart Jarvis backend and frontend?')) return

      try {
        document.getElementById('btn-restart').disabled = true
        toast('Restarting...', 'ok')
        const res = await fetch('/api/restart', { method: 'POST' })
        const data = await res.json()
        if (data.ok) {
          toast('Jarvis is restarting — give it a few seconds')
        } else {
          toast((data.errors || [data.error]).join(', '), 'err')
        }
      } catch (err) {
        toast(err.message, 'err')
      } finally {
        document.getElementById('btn-restart').disabled = false
      }
    }

    // Initial load + auto-refresh every 10s
    refresh()
    setInterval(refresh, 10000)
  </script>
</body>
</html>
