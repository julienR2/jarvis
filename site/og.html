<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    width: 1200px; height: 630px; position: relative;
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding: 0 90px; background: var(--bg);
  }
  .og::before {
    content: ''; position: absolute; inset: -200px -200px auto auto; width: 900px; height: 900px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 62%);
  }
  .og > * { position: relative; }
  .og img { width: 128px; height: 128px; }
  .og h1 { font-size: 68px; letter-spacing: -0.03em; max-width: 18ch; }
  .og h1 em { font-style: normal; color: var(--accent); }
  .og p { font-size: 26px; color: var(--text2); }
  .og .tag { font-size: 20px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="og">
    <img src="assets/jarvis_wave.png" alt="">
    <h1>The assistant that <em>rewrites itself</em>.</h1>
    <p>Self-hosted, Claude Code inside, full write access to its own source.</p>
    <span class="tag">github.com/julienR2/jarvis · MIT</span>
  </div>
</body>
</html>
