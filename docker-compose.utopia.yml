# Parallel "jarvis-utopia" instance.
# Same source tree (./ mounted at /jarvis), but its own data/workspace under
# ./agent-utopia and its own containers + host ports, so it runs alongside the
# primary Jarvis without conflict.
#
#   docker compose -f docker-compose.utopia.yml up
#
# Ports:  backend 3015 · frontend 5183 · admin 3016 (whisper/playwright internal only)
name: jarvis-utopia

services:
  # Pre-creates agent-utopia/{data,workspace} with uid 1000 ownership (same
  # rationale as the primary compose: keep playwright from racing them as root).
  setup:
    image: alpine:3
    command: sh -c "mkdir -p /agent/data /agent/workspace/apps /agent/workspace/uploads && chown -R 1000:1000 /agent"
    volumes:
      - ./agent-utopia:/agent
    restart: 'no'

  backend:
    build: ./backend
    container_name: jarvis-utopia-backend
    working_dir: /jarvis/backend
    command: sh -c "npm install && npx tsx watch src/index.ts"
    volumes:
      - ./:/jarvis
      - /jarvis/backend/node_modules
    env_file: .env
    environment:
      PORT: 3005
      DB_PATH: /jarvis/agent-utopia/data/jarvis.db
      WORKSPACE_DIR: /jarvis/agent-utopia/workspace
      SECRETS_PATH: /jarvis/agent-utopia/data/secrets.json
      JARVIS_REPO_DIR: /jarvis
      WHISPER_URL: http://whisper:9000
      SESSION_MANAGER_URL: http://session-manager:3010
      TZ: ${TZ:-UTC}
    ports:
      - '3015:3005'
    depends_on:
      setup:
        condition: service_completed_successfully
      session-manager:
        condition: service_started
    restart: unless-stopped

  session-manager:
    build: ./session-manager
    container_name: jarvis-utopia-session-manager
    working_dir: /jarvis/session-manager
    command: sh -c "npm install && npx tsx src/index.ts"
    volumes:
      - ./:/jarvis
      - /jarvis/session-manager/node_modules
    env_file: .env
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      CLAUDE_CONFIG_DIR: /jarvis/agent-utopia
      WORKSPACE_DIR: /jarvis/agent-utopia/workspace
      SECRETS_PATH: /jarvis/agent-utopia/data/secrets.json
      BACKEND_URL: http://backend:3005
      PORT: 3010
      TZ: ${TZ:-UTC}
    restart: unless-stopped

  frontend:
    image: node:25
    container_name: jarvis-utopia
    working_dir: /app
    # Dev server (not build+preview): avoids racing the primary instance on the
    # shared ./frontend/dist output. Same vite proxy → this project's backend.
    command: sh -c "npm install && npx vite --host --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5183:5173'
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: jarvis-utopia-admin
    working_dir: /app
    command: node server.js
    volumes:
      - ./admin:/app
      - ./:/jarvis
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: 3006
      REPO_DIR: /jarvis
      RESTART_CONTAINERS: jarvis-utopia-backend,jarvis-utopia
    ports:
      - '127.0.0.1:3016:3006'
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: jarvis-utopia-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper-cache-utopia:/root/.cache

  playwright:
    image: mcr.microsoft.com/playwright/mcp
    container_name: jarvis-utopia-playwright
    command: ["--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--headless", "--isolated", "--output-dir", "/uploads"]
    volumes:
      - ./agent-utopia/workspace/uploads:/uploads
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  whisper-cache-utopia:
